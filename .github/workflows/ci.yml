name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q
      # The gate must pass the recorded live baseline...
      - name: Gate passes on the recorded baseline
        run: >
          uv run agent-evals gate --run runs/triage-live-baseline
          --dataset datasets/triage_book3_six.jsonl
          --policy policies/book3_original.yaml
      # ...and must block the deliberate regression (a step that succeeds only if the gate fails).
      - name: Gate blocks the deliberate regression
        run: |
          uv run agent-evals run --adapter triage-regressed --dataset datasets/triage_book3_six.jsonl --out /tmp/regressed
          if uv run agent-evals gate --run /tmp/regressed --dataset datasets/triage_book3_six.jsonl --policy policies/book3_original.yaml; then
            echo "the gate failed to block the regression" && exit 1
          fi
