[project]
name = "agent-evals"
version = "0.1.0"
description = "A small, vendor-neutral harness for evaluating AI agents, built chapter by chapter for the book Evaluating AI Agents."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Adrian Morgan Sebuliba" }]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "triage-app",
    "reliable-agents-labs",
]

[project.scripts]
agent-evals = "agent_evals.cli:main"

[project.optional-dependencies]
containers = [
    "testcontainers[postgres]>=4.15.0",
]

[tool.uv.sources]
triage-app = { git = "https://github.com/IAgentic-LLC/triage-app.git", tag = "ch35-end" }
reliable-agents-labs = { git = "https://github.com/Sebuliba-Adrian/reliable-agents-labs.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_evals"]

[dependency-groups]
dev = ["pytest>=9.1", "pytest-asyncio>=1.4", "ruff>=0.16"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
